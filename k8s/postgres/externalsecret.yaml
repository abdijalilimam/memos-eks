apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: memos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: postgres
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: memos-eks/prod/postgres
        property: password
