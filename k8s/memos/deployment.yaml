apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
        - name: memos
          image: 305476115260.dkr.ecr.us-east-2.amazonaws.com/memos:cf084ac
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: memos-config
          env:
            - name: MEMOS_DSN
              valueFrom:
                secretKeyRef:
                  name: memos-db
                  key: MEMOS_DSN
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
