apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-db
  namespace: memos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: memos-db
    template:
      data:
        MEMOS_DSN: "postgresql://memos:{{ .password }}@postgres:5432/memos?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: memos-eks/prod/postgres
        property: password
